services:
  postgres:
    image: postgres:17-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - library-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  library-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library
      SPRING_DATASOURCE_USERNAME: library
      SPRING_DATASOURCE_PASSWORD: library
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      APP_METADATA_GOOGLE_BOOKS_ENABLED: ${APP_METADATA_GOOGLE_BOOKS_ENABLED:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  library-postgres-data:
