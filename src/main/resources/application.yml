spring:
  application:
    name: library-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library}
    username: ${SPRING_DATASOURCE_USERNAME:library}
    password: ${SPRING_DATASOURCE_PASSWORD:library}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: Library Management System
    version: 1.0.0

app:
  borrowing:
    default-loan-days: 14
  waitlist:
    reservation-hours: 24
  fees:
    late-fee-per-day: 0.50
    currency: EUR
  metadata:
    google-books-enabled: ${APP_METADATA_GOOGLE_BOOKS_ENABLED:false}
    google-books-base-url: https://www.googleapis.com/books/v1
